[package]
name = "kix-raft"
version = "0.1.0"
edition = "2021"
description = "Deterministic Raft consensus core (leader election, log replication, snapshots, membership) for replicated kixdb shards"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
crc32fast = "1"

[dev-dependencies]
tempfile = "3"
