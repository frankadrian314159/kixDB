[package]
name = "kix-control"
version = "0.1.0"
edition = "2021"
description = "The control node of distributed kixdb: q / qSQL routing, planning and merging over shard nodes, and a kdb+ IPC gateway"
license = "MIT"

[lib]
name = "kix_control"
path = "src/lib.rs"

[[bin]]
name = "kix-cluster"
path = "src/main.rs"

[dependencies]
mimalloc = "0.1"
kixdb = { path = "../../.." }
kix-shared-ces = { path = "../shared-ces" }
kix-storage = { path = "../storage" }
arrow-flight = "60"
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
crc32fast = "1"

[dev-dependencies]
kix-raft = { path = "../raft" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.8"
tempfile = "3"
